{{ define "main" }}

<div class="work-header">
  <h1>
    {{- if eq .Data.Plural "practices" -}}
      {{ T "practices" | default .Title }}
    {{- else -}}
      {{ .Title }}
    {{- end -}}
  </h1>
</div>

{{ .Content }}

<div class="work-tag">
  {{ range .Pages }}
    <span><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a> ({{ len .Pages }})</span>
  {{ end }}
</div>

{{ end }}
