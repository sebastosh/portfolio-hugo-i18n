{{ if or .NextInSection .PrevInSection }}
<div class="pagination">

  {{ if .NextInSection }}
  <a href="{{ .NextInSection.RelPermalink }}">← {{ .NextInSection.Title }}</a>
  {{ else }}
  <span></span>
  {{ end }}

  {{ if .PrevInSection }}
  <a href="{{ .PrevInSection.RelPermalink }}">{{ .PrevInSection.Title }} →</a>
  {{ else }}
  <span></span>
  {{ end }}

</div>
{{ end }}
