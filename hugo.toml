    identifier = 'about'
    name = 'About'
    url = 'about/'
    weight = 10
  [[menus.main]]
    identifier = 'work'
    name = 'Work'
    url = 'work/'
    weight = 20
  [[menus.main]]
    identifier = 'contact'
    pageRef = '/contact'
    weight = 25
  # [[menus.main]]
  #   identifier = 'tags'
  #   name = 'tags'
  #   url  = 'tags/'
  #   weight = 40

  [[menus.main]]
    identifier = 'language'
    name = 'en'
    weight = 30
    [[menus.main]]
        parent = "language"
        name = 'en'
        weight = 31
    [[menus.main]]
        parent = "language"
        name = 'es'
        weight = 32

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'en 🇺🇸'
    LanguageDirection = 'ltr'
    timeZone = 'America/New_York'
    title = 'Sebastien Sanz de Santamaria'
    weight = 1
    [languages.en.pagination]
        path = 'page'
    [languages.en.params]
        description = 'Product Manager / Owner / UX Designer, Web Developer, Cultural Producer'
        latest = 'Latest'
        more = 'More'
  [languages.es]
    languageCode = 'es-MX'
    languageName = 'es 🇲🇽'
    LanguageDirection = 'ltr'
    timeZone = "America/Mexico_City"
    title = 'Sebastien Sanz de Santamaria'
    weight = 2
    [languages.es.pagination]
        path = 'página'
    [languages.es.params]
        description = 'Gerente / Dueño / Diseño de Producto, Desarrollador Web, Productor Cultural'
        latest = 'Utimas'
        more = 'Mas'
    [languages.es.permalinks]
        _work = "/obra/"
        work = "/obra/:slug"
      [languages.es.permalinks.section]
        contact = "/contacto/"
        thanks = "/gracias/"

[taxonomies]
  tag = 'tags'
  practice = 'practices'

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"